<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building Explorer</title>
<script src="/config.js"></script>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --ink:#121a2b; --muted:#5a6577; --faint:#8a94a6; --line:#d7dde6;
  --accent:#9a5f00; --accent-soft:#fcefcb; --link:#2a63c9;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --surface:#151d2c; --surface-2:#1b2435; --ink:#e6ebf3; --muted:#9da8ba; --faint:#6f7a8d; --line:#273246;
    --accent:#f5c55a; --accent-soft:#3a2e12; --link:#7fa6f0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#151d2c; --surface-2:#1b2435; --ink:#e6ebf3; --muted:#9da8ba; --faint:#6f7a8d; --line:#273246;
  --accent:#f5c55a; --accent-soft:#3a2e12; --link:#7fa6f0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link)}
h1{font-size:1.65rem;margin:0;line-height:1.2}
h2{font-size:1.3rem;margin:0 0 4px}
h3{font-size:1.02rem;margin:18px 0 8px}
p{margin:6px 0;max-width:75ch}
code,.mono{font-family:var(--mono);font-size:.86em}
.muted{color:var(--muted)} .small{font-size:.86rem}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top-inner nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.top-inner nav a{text-decoration:none;color:var(--muted);padding:4px 9px;border-radius:6px;font-size:.88rem}
.top-inner nav a:hover{background:var(--surface-2);color:var(--ink)}
select,button{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
button{cursor:pointer} button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:8px}
.hero img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface);display:inline-flex;gap:5px;align-items:center}
.chip .dot{width:7px;height:7px;border-radius:50%}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}
section > .sub{color:var(--muted);margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.tile{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg)}
.tile .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tile .v{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.tile .s{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablebox{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:9px}
tbody tr:hover td{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:.92rem}
.callout p{margin:3px 0}
details{border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-top:10px;background:var(--bg)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem}
pre.json{max-height:420px;overflow:auto;font:12px/1.5 var(--mono);margin:8px 0 0;white-space:pre-wrap;word-break:break-word}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--surface);padding:7px 9px;border-radius:7px;font-size:.8rem;line-height:1.4;max-width:280px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pano{height:380px;border-radius:10px;border:1px solid var(--line);background-repeat:repeat-x;background-size:auto 100%;cursor:grab;touch-action:none}
.plan{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.plan img,.plan svg{display:block;width:100%;height:auto}
.plan svg{position:absolute;inset:0;height:100%}
.plan polygon{fill:transparent;stroke:none;cursor:pointer}
.plan polygon:hover,.plan polygon.on{fill:rgba(57,135,229,.22)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.8rem;background:var(--surface-2);border-radius:6px;padding:2px 8px}
iframe.tour{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;background:#000}
.err{color:var(--critical);font-size:.88rem}
/* Building picker + room picker */
.shell{display:grid;grid-template-columns:330px minmax(0,1fr);max-width:1600px;margin:0 auto}
.shell main{max-width:none;margin:0;min-width:0}
aside.picker{position:sticky;top:var(--hdr,53px);height:calc(100vh - var(--hdr,53px));display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface)}
.picker .ctl{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.picker input[type=search]{font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.picker .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.picker .row select{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 9px;font-size:.82rem;background:var(--surface)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.picker .count{font-size:.78rem;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line)}
.picker ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.picker li button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.picker li button:hover{background:var(--surface-2)}
.picker li button[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.picker li button:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.picker .t{font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:baseline;justify-content:space-between}
.picker .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker .d{font-size:.78rem;color:var(--muted)}
.badge{font-size:.68rem;font-weight:600;border-radius:5px;padding:1px 6px;white-space:nowrap;flex:none}
.badge.res{background:color-mix(in srgb,var(--target) 16%,transparent);color:var(--target)}
.badge.com{background:color-mix(in srgb,var(--costar) 18%,transparent);color:var(--costar)}
.badge.scan{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.picker .more{padding:10px 12px;font-size:.8rem;color:var(--muted)}
.rooms-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.rooms-chips button{font-size:.82rem;padding:3px 10px;border-radius:999px}
.plan polygon.sel{fill:rgba(250,178,25,.35);stroke:#9a5f00;stroke-width:6}
.roomcard{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--bg);margin-bottom:12px}
.roomcard h4{margin:0 0 4px;font-size:1.1rem}
.roomcard .tiles{margin:8px 0 4px}
.roomcard .tiles{grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.roomcard .tile{background:var(--surface);padding:8px 10px}
.roomcard .tile .v{font-size:1.15rem}
.joblog{max-height:240px;overflow:auto;font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;margin-top:10px}
button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);padding:7px 14px}
button.primary:disabled{opacity:.55;cursor:default}
.hero .noimg{aspect-ratio:4/3;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--faint);font-size:.9rem;text-align:center;padding:16px}
@media (max-width:960px){.hero,.grid2{grid-template-columns:1fr}.top-inner nav{margin-left:0}
  .shell{grid-template-columns:1fr} aside.picker{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)} .picker ul{max-height:300px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <strong>Building explorer</strong>
  <span class="muted small" id="hdrInfo"></span>
  <nav id="sectionNav">
    <a href="#matterport">Matterport</a><a href="#drone">Drone &amp; splat</a>
    <a href="#vexcel">Vexcel</a><a href="#costar">CoStar</a><a href="/keys">Key check</a>
  </nav>
</div></header>
<div class="shell">
<aside class="picker" aria-label="Choose a building">
  <div class="ctl">
    <input type="search" id="q" placeholder="Search address, name, city or model id" aria-label="Search buildings" autocomplete="off">
    <div class="row">
      <div class="seg" role="group" aria-label="Kind" id="kindSeg">
        <button data-k="" aria-pressed="true">All</button><button data-k="residential" aria-pressed="false">Residential</button><button data-k="commercial" aria-pressed="false">Commercial</button>
      </div>
    </div>
    <div class="row">
      <select id="citySel" aria-label="City"><option value="">All cities</option></select>
      <select id="sortSel" aria-label="Sort"><option value="scan">Scanned first</option><option value="address">Address</option><option value="price">Price</option><option value="sqft">Size</option><option value="stories">Stories</option><option value="year">Year built</option></select>
    </div>
    <label class="small muted"><input type="checkbox" id="scanOnly"> Only buildings with scan data downloaded</label>
  </div>
  <div class="count" id="count" aria-live="polite">Loading catalog…</div>
  <ul id="list"></ul>
</aside>
<main id="app"><p class="muted">Loading…</p></main>
</div>
<div class="tip" id="tip"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
function h(tag, attrs = {}, ...kids) {
  const svgTags = ['svg','g','line','polyline','polygon','circle','rect','path','text','defs','marker','linearGradient','stop'];
  const e = svgTags.includes(tag) ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.setAttribute('class', v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const fmt = (v, d = 1) => v == null || Number.isNaN(v) ? '–' : Number(v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: 0 });
const money = v => v == null ? '–' : '$' + Number(v).toLocaleString();
const date = s => s ? new Date(s).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '–';
const tip = $('#tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.display = 'block';
  const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
const hideTip = () => tip.style.display = 'none';
function kv(pairs) { return h('dl', { class: 'kv' }, pairs.filter(p => p).flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v ?? '–')])); }
function tile(k, v, s, extra = {}) { return h('div', { class: 'tile', ...extra }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v), s ? h('div', { class: 's' }, s) : null); }
function rawJson(title, obj) { return h('details', {}, h('summary', {}, title), h('pre', { class: 'json' }, JSON.stringify(obj, null, 1))); }
function guard(title, fn) { try { return fn(); } catch (e) { console.error(e); return h('section', {}, h('h2', {}, title), h('p', { class: 'err' }, 'Could not render: ' + e.message)); } }

// ------------------------------------------------------------------ Building picker
let CATALOG = [], BUILDINGS = [], BY_SID = {}, ENUMS = {}, NAMES = {}, CURRENT = null;
const PICK = { q: '', kind: '', city: '', sort: 'scan', scanOnly: false, limit: 200 };
const enumName = (e, v) => v == null ? null : String(ENUMS[e]?.[String(v)] ?? v).replace(/([a-z])([A-Z])/g, '$1 $2');
const params = () => new URLSearchParams(location.search);
const rowTitle = r => r.name || r.address || 'Address not disclosed';
const rowSummary = r => r.kind === 'residential'
  ? [r.price ? money(r.price) : null, r.beds != null ? `${r.beds} bd` : null, r.baths != null ? `${r.baths} ba` : null, r.sqft ? `${fmt(r.sqft, 0)} sq ft` : null, r.year ? `built ${r.year}` : null].filter(Boolean).join(' · ')
  : [r.type, r.stories ? `${r.stories} stories` : null, r.sqft ? `${fmt(r.sqft, 0)} sq ft` : null, r.year ? `built ${r.year}` : null].filter(Boolean).join(' · ');

function setNav(links) {
  const sid = params().get('m');
  $('#sectionNav').replaceChildren(...links.map(([href, t]) => h('a', { href }, t)),
    h('a', { href: '/acoustics' + (sid ? '?m=' + encodeURIComponent(sid) : ''), title: 'Room acoustics app (port 8766)' }, 'Acoustics ↗'),
    h('a', { href: '/keys' }, 'Key check'));
}

// One building = one CoStar listing / property; it can hold many Matterport scans (suites, units).
function groupBuildings() {
  const byKey = new Map();
  for (const r of CATALOG) {
    const key = r.kind + ':' + r.costar_id;
    if (!byKey.has(key)) byKey.set(key, { ...r, key, rows: [] });
    byKey.get(key).rows.push(r);
    BY_SID[r.sid] = r; r.key = key;
  }
  BUILDINGS = [...byKey.values()];
  for (const b of BUILDINGS) {
    b.cachedCount = b.rows.filter(r => r.cached).length;
    b._hay = [b.address, b.name, b.city, b.state, b.type, b.costar_id, ...b.rows.map(r => r.sid)].filter(Boolean).join(' ').toLowerCase();
  }
}
const buildingOf = sid => BUILDINGS.find(b => b.key === BY_SID[sid]?.key);

function filtered() {
  const words = PICK.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = BUILDINGS.filter(b => (!PICK.kind || b.kind === PICK.kind) && (!PICK.city || b.city === PICK.city) && (!PICK.scanOnly || b.cachedCount)
    && (!words.length || words.every(w => b._hay.includes(w))));
  const num = k => (a, b) => (b[k] ?? -Infinity) - (a[k] ?? -Infinity);
  const byAddr = (a, b) => rowTitle(a).localeCompare(rowTitle(b));
  const cmp = { scan: (a, b) => (b.cachedCount - a.cachedCount) || (b.rows.length - a.rows.length) || byAddr(a, b), address: byAddr,
    price: num('price'), sqft: num('sqft'), stories: num('stories'), year: num('year') }[PICK.sort];
  return rows.sort(cmp);
}

function renderList() {
  const rows = filtered(), list = $('#list'), cur = BY_SID[CURRENT]?.key;
  const scans = rows.reduce((a, b) => a + b.rows.length, 0);
  $('#count').textContent = `${fmt(rows.length, 0)} of ${fmt(BUILDINGS.length, 0)} buildings · ${fmt(scans, 0)} scans` + (rows.length > PICK.limit ? ` · showing ${PICK.limit}` : '');
  list.replaceChildren(...rows.slice(0, PICK.limit).map(b => h('li', {}, h('button', {
      'aria-current': b.key === cur ? 'true' : 'false', 'data-key': b.key,
      onclick: () => selectBuilding((b.rows.find(r => r.cached) || b.rows[0]).sid) },
    h('div', { class: 't' }, h('span', {}, rowTitle(b)),
      h('span', { style: 'display:flex;gap:4px' },
        b.cachedCount ? h('span', { class: 'badge scan', title: 'Scan, aerial and outline data downloaded' }, 'data') : null,
        b.rows.length > 1 ? h('span', { class: 'badge', style: 'background:var(--surface-2);color:var(--muted)', title: 'Matterport scans of spaces in this building' }, `${b.rows.length} scans`) : null,
        h('span', { class: 'badge ' + (b.kind === 'residential' ? 'res' : 'com') }, b.kind === 'residential' ? 'Res' : 'Com'))),
    h('div', { class: 'd' }, (b.name ? b.address + ', ' : '') + `${b.city}, ${b.state}`),
    h('div', { class: 'd' }, rowSummary(b) || h('span', { class: 'mono' }, b.rows[0].sid))))));
  if (rows.length > PICK.limit) list.append(h('li', {}, h('button', { class: 'more', onclick: () => { PICK.limit += 300; renderList(); } }, `Show more (${fmt(rows.length - PICK.limit, 0)} left)…`)));
}

function initPicker() {
  groupBuildings();
  const cities = [...new Set(BUILDINGS.map(b => `${b.city}|${b.state}`))].sort();
  cities.forEach(c => { const [city, st] = c.split('|'); $('#citySel').append(h('option', { value: city }, `${city}, ${st} (${fmt(BUILDINGS.filter(b => b.city === city).length, 0)})`)); });
  let t; $('#q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { PICK.q = e.target.value; PICK.limit = 200; renderList(); }, 120); });
  $('#kindSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; PICK.kind = b.dataset.k; PICK.limit = 200;
    $('#kindSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); renderList(); });
  $('#citySel').onchange = e => { PICK.city = e.target.value; PICK.limit = 200; renderList(); };
  $('#sortSel').onchange = e => { PICK.sort = e.target.value; renderList(); };
  $('#scanOnly').onchange = e => { PICK.scanOnly = e.target.checked; PICK.limit = 200; renderList(); };
  window.addEventListener('popstate', () => { const sid = params().get('m'); if (sid && sid !== CURRENT) selectBuilding(sid, { push: false }); });
}

async function main() {
  const hdr = $('header.top');
  new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px')).observe(hdr);
  [CATALOG, ENUMS] = await Promise.all([
    fetch('/api/catalog').then(r => r.json()),
    fetch('/api/enums').then(r => r.ok ? r.json() : {}).catch(() => ({}))]);
  initPicker();
  const first = params().get('m') || CATALOG.find(r => r.cached)?.sid || CATALOG[0]?.sid;
  renderList();
  if (first) selectBuilding(first, { push: false, room: params().get('room') });
}

// The scans (suites / units) of the current building, so you can switch between them.
function scansBar(sid) {
  const b = buildingOf(sid);
  if (!b || b.rows.length < 2) return null;
  const btns = {};
  const label = r => NAMES[r.sid] || r.sid;
  const wrap = h('div', { class: 'rooms-chips', role: 'group', 'aria-label': 'Scans in this building' },
    b.rows.slice().sort((x, y) => (y.cached - x.cached) || label(x).localeCompare(label(y))).map(r =>
      btns[r.sid] = h('button', { 'aria-pressed': r.sid === sid ? 'true' : 'false', title: r.sid, onclick: () => r.sid !== CURRENT && selectBuilding(r.sid) },
        label(r), r.cached ? h('span', { class: 'badge scan', style: 'margin-left:6px' }, 'data') : null)));
  const missing = b.rows.map(r => r.sid).filter(s => !(s in NAMES));
  if (missing.length) fetch('/api/names?ids=' + missing.slice(0, 60).join(',')).then(r => r.json()).then(names => {
    Object.assign(NAMES, names);
    for (const [s, n] of Object.entries(names)) if (n && btns[s]) btns[s].firstChild.textContent = n;
  }).catch(() => {});
  return h('section', { id: 'scans', style: 'padding:14px 18px' },
    h('h2', { style: 'font-size:1.05rem' }, `${b.rows.length} Matterport scans in this building`),
    h('p', { class: 'sub small' }, `Each scan is a separate space (a suite or unit). ${b.cachedCount ? `${b.cachedCount} downloaded (marked “data”); the` : 'The'} others show the building’s CoStar records until you download them.`),
    wrap);
}

async function selectBuilding(sid, { push = true, room = null } = {}) {
  CURRENT = sid;
  const row = BY_SID[sid];
  if (push) history.pushState(null, '', '?m=' + sid);
  else { const u = new URL(location); u.searchParams.set('m', sid); history.replaceState(null, '', u); }
  document.querySelectorAll('#list button[data-key]').forEach(b => b.setAttribute('aria-current', b.dataset.key === row?.key ? 'true' : 'false'));
  $('#hdrInfo').textContent = row ? `${rowTitle(row)} · ${row.city}` : sid;
  const app = $('#app');
  app.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
  window.scrollTo({ top: 0 });
  try {
    if (row?.cached) await renderFull(sid, room);

async function startFetch(sid, btn, box) {
  btn.disabled = true; btn.textContent = 'Downloading…';
  const log = h('div', { class: 'joblog', 'aria-live': 'polite' }); box.append(log);
  let job = await fetch('/api/fetch/' + sid, { method: 'POST' }).then(r => r.json());
  while (job.state === 'running') {
    log.textContent = job.log.join('\n'); log.scrollTop = log.scrollHeight;
    await new Promise(r => setTimeout(r, 1200));
    job = await fetch('/api/fetch/' + sid).then(r => r.json());
  }
  log.textContent = job.log.join('\n'); log.scrollTop = log.scrollHeight;
  if (job.state === 'done') {
    const row = CATALOG.find(r => r.sid === sid); if (row) row.cached = true;
    renderList();
    if (CURRENT === sid) selectBuilding(sid, { push: false });
  } else { btn.disabled = false; btn.textContent = 'Retry download'; box.append(h('p', { class: 'err' }, 'The download failed; see the log above.')); }
}

// ------------------------------------------------------------------ Rooms
function polyArea(pts) { let a = 0; for (let i = 0; i < pts.length; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length]; a += x1 * y2 - x2 * y1; } return Math.abs(a) / 2; }
function polyPerim(pts) { let p = 0; for (let i = 0; i < pts.length; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length]; p += Math.hypot(x2 - x1, y2 - y1); } return p; }
function inPoly([x, y], pts) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j];
  if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function distToPoly([x, y], pts) { let best = Infinity; for (let i = 0; i < pts.length; i++) { const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy, t = L ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L)) : 0;
  best = Math.min(best, Math.hypot(x - ax - t * dx, y - ay - t * dy)); } return best; }
const M2_TO_FT2 = 10.7639;

function renderRooms(b, base, initialRoom) {
  const M = b.matterport;
  const sec = h('section', { id: 'rooms' }, h('h2', {}, 'Rooms'),
    h('p', { class: 'sub' }, 'Pick a room on the plan, in the list or in the table to see everything the scan knows about it.'));
  // Name each room; repeat labels get a number (Bedroom 1, Bedroom 2).
  const rooms = M.rooms.filter(r => r.label !== 'Void');
  const seen = {}, totals = {};
  rooms.forEach(r => { const l = r.label || 'Unlabelled'; totals[l] = (totals[l] || 0) + 1; });
  rooms.forEach(r => { const l = r.label || 'Unlabelled'; seen[l] = (seen[l] || 0) + 1; r._name = totals[l] > 1 ? `${l} ${seen[l]}` : l; });
  rooms.sort((a, c) => (c.dimensions?.areaFloor || 0) - (a.dimensions?.areaFloor || 0));
  const labelledArea = rooms.reduce((a, r) => a + (r.label ? r.dimensions?.areaFloor || 0 : 0), 0);
  const floorName = id => M.floors.find(f => f.id === id)?.label || '–';
  if (!rooms.length) { sec.append(h('p', { class: 'muted' }, 'The scan has no room segmentation.')); return sec; }

  const card = h('div', { class: 'roomcard', 'aria-live': 'polite' });
  const chips = h('div', { class: 'rooms-chips', role: 'group', 'aria-label': 'Rooms' });
  const polyById = {}, rowById = {}, chipById = {};
  let current = null;

  function describe(r) {
    const d = r.dimensions || {}, poly = r.polygon?.length > 2 ? r.polygon : null;
    const panos = poly ? M.panos.filter(p => inPoly([p.position.x, p.position.y], poly)) : [];
    const walls = poly ? M.walls.filter(w => w.floor === r.floor && distToPoly(w.a, poly) < 0.25 && distToPoly(w.b, poly) < 0.25) : [];
    const wallLen = walls.reduce((a, w) => a + Math.hypot(w.b[0] - w.a[0], w.b[1] - w.a[1]), 0);
    const share = r.label && labelledArea ? (d.areaFloor || 0) / labelledArea : null;
    const shownPano = M.pano && panos.some(p => p.id === M.pano.id);
    card.replaceChildren(
      h('div', { class: 'muted small mono' }, `room ${r.id} · ${floorName(r.floor)}`),
      h('h4', {}, r._name),
      h('div', { class: 'tiles' },
        tile('Floor area', `${fmt(d.areaFloor)} m²`, `${fmt((d.areaFloor || 0) * M2_TO_FT2, 0)} sq ft${share != null ? ` · ${fmt(share * 100, 0)}% of labelled area` : ''}`),
        tile('Width × depth', d.width ? `${fmt(d.width, 2)} × ${d.depth ? fmt(d.depth, 2) : '–'} m` : '–', 'bounding dimensions from Matterport'),
        tile('Ceiling', d.height ? `${fmt(d.height, 2)} m` : '–', d.height ? `volume ≈ ${fmt((d.areaFloor || 0) * d.height, 0)} m³` : 'not measured'),
        tile('Perimeter', poly ? `${fmt(polyPerim(poly), 1)} m` : '–', poly ? `${walls.length} wall segments · ${fmt(wallLen, 1)} m of wall` : 'no outline in the scan'),
        tile('Scan positions', panos.length, panos.length ? 'panos ' + panos.map(p => p.label).join(', ') : 'none inside the outline')),
      h('p', { class: 'small muted' }, [
        poly ? `Outline: ${poly.length} corners, ${fmt(polyArea(poly), 1)} m² by polygon.` : 'This segment has no outline, so it cannot be drawn on the plan.',
        shownPano ? ' The panorama in the Matterport section was taken in this room.' : '',
        ' Windows and light are not in the room data yet.'].join('')));
  }

  function select(id, { scroll = false } = {}) {
    const r = rooms.find(x => x.id === id); if (!r) return;
    current = id;
    Object.entries(polyById).forEach(([k, p]) => p.classList.toggle('sel', k === id));
    Object.entries(rowById).forEach(([k, tr]) => tr.classList.toggle('sel', k === id));
    Object.entries(chipById).forEach(([k, c]) => c.setAttribute('aria-pressed', k === id ? 'true' : 'false'));
    describe(r);
    const u = new URL(location); u.searchParams.set('room', id); history.replaceState(null, '', u);
    if (scroll) rowById[id]?.scrollIntoView({ block: 'nearest' });
  }

  rooms.forEach(r => { chipById[r.id] = h('button', { 'aria-pressed': 'false', onclick: () => select(r.id, { scroll: true }) }, r._name); chips.append(chipById[r.id]); });

  const tbody = h('tbody');
  for (const r of rooms) {
    const d = r.dimensions || {};
    rowById[r.id] = h('tr', { style: 'cursor:pointer', onclick: () => select(r.id),
        onmouseenter: () => polyById[r.id]?.classList.add('on'), onmouseleave: () => polyById[r.id]?.classList.remove('on') },
      h('td', {}, r._name), h('td', { class: 'num' }, fmt(d.areaFloor)), h('td', { class: 'num' }, fmt(d.width, 2)), h('td', { class: 'num' }, fmt(d.depth, 2)), h('td', { class: 'num' }, fmt(d.height, 2)));
    tbody.append(rowById[r.id]);
  }
  const table = h('div', { class: 'tablebox' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Room'), h('th', { class: 'num' }, 'Area m²'), h('th', { class: 'num' }, 'Width'), h('th', { class: 'num' }, 'Depth'), h('th', { class: 'num' }, 'Ceiling'))), tbody));

  const fp = M.floorplans.find(f => f.flags.length === 1) || M.floorplans[0];
  let planBox = h('p', { class: 'muted' }, 'No floor plan image for this scan.');
  if (fp) {
    const tx = x => (x - fp.origin.x) * fp.resolution, ty = y => fp.height - (y - fp.origin.y) * fp.resolution;
    const svg = h('svg', { viewBox: `0 0 ${fp.width} ${fp.height}` });
    for (const w of M.walls) svg.append(h('line', { x1: tx(w.a[0]), y1: ty(w.a[1]), x2: tx(w.b[0]), y2: ty(w.b[1]), stroke: '#eb6834', 'stroke-width': 9, 'stroke-linecap': 'round', opacity: .9 }));
    for (const r of rooms) {
      if (!(r.polygon?.length > 2)) continue;
      const d = r.dimensions || {};
      const text = `${r._name} · ${fmt(d.areaFloor)} m²${d.width ? ` · ${fmt(d.width, 2)} × ${fmt(d.depth, 2)} m` : ''}${d.height ? ` · ceiling ${fmt(d.height, 2)} m` : ''}`;
      const p = h('polygon', { points: r.polygon.map(([x, y]) => `${tx(x)},${ty(y)}`).join(' '), tabindex: 0, role: 'button', 'aria-label': r._name,
        onclick: () => select(r.id, { scroll: true }), onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(r.id, { scroll: true }); } },
        onmousemove: e => { showTip(e, text); p.classList.add('on'); }, onmouseleave: () => { hideTip(); p.classList.remove('on'); } });
      polyById[r.id] = p; svg.append(p);
      const cx = r.polygon.reduce((a, q) => a + q[0], 0) / r.polygon.length, cy = r.polygon.reduce((a, q) => a + q[1], 0) / r.polygon.length;
      if ((d.areaFloor || 0) > 4) svg.append(h('text', { x: tx(cx), y: ty(cy), 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 600, fill: '#121a2b', 'pointer-events': 'none' }, r._name));
    }
    for (const p of M.panos) svg.append(h('circle', { cx: tx(p.position.x), cy: ty(p.position.y), r: p.id === M.pano?.id ? 16 : 9, fill: p.id === M.pano?.id ? 'none' : '#2a78d6', stroke: p.id === M.pano?.id ? '#6250d6' : '#fff', 'stroke-width': p.id === M.pano?.id ? 6 : 3, 'pointer-events': 'none' }));
    planBox = h('div', {}, h('div', { class: 'plan' }, h('img', { src: base + fp.file, alt: 'Matterport floor plan' }), svg),
      h('div', { class: 'legend' }, h('span', {}, h('span', { class: 'sw', style: 'background:#eb6834' }), 'walls (graph)'),
        h('span', {}, h('span', { class: 'sw', style: 'background:#2a78d6;border-radius:50%' }), 'scan positions'),
        h('span', {}, h('span', { class: 'sw', style: 'border:2px solid #6250d6;border-radius:50%' }), 'panorama in the Matterport section'),
        h('span', {}, h('span', { class: 'sw', style: 'background:rgba(250,178,25,.5);border:1px solid #9a5f00' }), 'selected room')));
  }
  sec.append(chips, h('div', { class: 'grid2' }, planBox, h('div', {}, card, table)));
  select(rooms.some(r => r.id === initialRoom) ? initialRoom : (rooms.find(r => r.label && r.polygon?.length > 2) || rooms[0]).id);
  return sec;
}

    sec.append(h('div', { class: 'tiles' },
      tile('List price', money(L.currentPrice), L.originalPrice !== L.currentPrice ? 'was ' + money(L.originalPrice) : 'original price'),
      tile('Listed', date(L.listDate), `${L.dom} days on market`), tile('Home', `${fmt(P.sqftMax, 0)} sq ft`, `${P.bedsMax} bed · ${P.bathsMax} bath`),
      tile('Lot', `${fmt(P.lotSizeAcresMax, 3)} acres`, F?.derivedValues?.lotSizeInAcres ? '' : ''), tile('Built', P.yearBuilt, `${P.stories} story · ${P.totalParkingSpaces} parking`)));
    const a = P.address || {};
    sec.append(h('div', { class: 'grid2' },
      kv([['Listing id', h('code', {}, L.id)], ['Residential listing id', h('code', {}, L.residentialListingId)], ['Property id', h('code', {}, L.propertyId)],
        ['Address', a.fullStreetAddress ? `${a.fullStreetAddress}, ${a.city}, ${a.state} ${a.zip}` : cs.match?.address], ['Lat / lon', a.latitude ? `${a.latitude}, ${a.longitude}` : '–'],
        ['MLS type', P.mlsPropertyType], ['Has 3D tour', L.has3DTour ? 'yes' : 'no'], ['Fireplace / hardwood', `${L.resoValues?.hasFireplace ? 'yes' : 'no'} / ${L.resoValues?.hasHardwoodFloors ? 'yes' : 'no'}`],
        ['Architectural style', L.resoValues?.structure?.architecturalStyle || '–']]),
      h('div', {}, h('div', { class: 'muted small' }, 'Remarks'), h('p', { class: 'small' }, L.remarks || '–'))));
    if (F) {
      sec.append(h('h3', {}, 'Highlights'), h('div', { class: 'tags' }, (F.highlights || []).map(x => h('span', { class: 'tag' }, x.text))));
      sec.append(h('h3', {}, 'Features'), h('div', { class: 'grid2' }, (F.sections || []).map(s => h('div', {}, h('div', { class: 'small', style: 'font-weight:600' }, `${s.category} · ${s.subcategory}`), h('div', { class: 'small muted' }, s.lines.join(' · '))))));
    }
    const photos = (L.media || []).filter(m => /imagescdn|\.jpe?g/i.test(m.uri) && !/matterport/.test(m.uri));
    if (photos.length) sec.append(h('h3', {}, `Listing photos (${photos.length})`), h('div', { class: 'photos' }, photos.slice(0, 24).map(m => h('img', { src: m.uri, loading: 'lazy', alt: 'Listing photo', referrerpolicy: 'no-referrer', onerror: e => e.target.remove() }))));
    if (L.history?.length) sec.append(h('h3', {}, 'Listing history'), h('div', { class: 'tablebox' }, h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, 'Date'), h('th', {}, 'Update type'), h('th', {}, 'Old'), h('th', {}, 'New'), h('th', { class: 'num' }, 'Price'))),
      h('tbody', {}, L.history.map(x => h('tr', {}, h('td', {}, date(x.date)), h('td', {}, x.updateType), h('td', {}, x.oldValueString ?? '–'), h('td', {}, x.newValueString ?? '–'), h('td', { class: 'num' }, money(x.currentPrice))))))));
  }
  if (cs.property) sec.append(renderCommercial(cs.property), rawJson('Raw commercial property record', cs.property));
  if (cs.nearby) sec.append(h('h3', {}, 'CoStar commercial properties in the aerial clip'),
    h('div', { class: 'tablebox' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Name'), h('th', {}, 'Address'), h('th', { class: 'num' }, 'Distance'), h('th', { class: 'num' }, 'Stories'), h('th', { class: 'num' }, 'Height ft'), h('th', { class: 'num' }, 'Year'), h('th', { class: 'num' }, 'RBA sq ft'))),
      h('tbody', {}, cs.nearby.map(c => h('tr', {}, h('td', {}, c.name || '–'), h('td', {}, c.address), h('td', { class: 'num' }, c.distance_m + ' m'), h('td', { class: 'num' }, c.stories ?? '–'), h('td', { class: 'num' }, c.height_ft ?? '–'), h('td', { class: 'num' }, c.year_built ?? '–'), h('td', { class: 'num' }, fmt(c.rba_sf, 0))))))));
  if (L) sec.append(rawJson('Raw residential listing', L));
  if (F) sec.append(rawJson('Raw listing features', F));
  return sec;
}

function renderCommercial(C) {
  const a = C.primaryAddress || {}, yr = (C.constructionEvents || []).find(e => e.year)?.year;
  const reno = (C.constructionEvents || []).filter(e => e.year && e.year !== yr).map(e => `${enumName('ConstructionEventType', e.eventType) || 'event'} ${e.year}`);
  const note = (C.notes || []).map(n => n.value).filter(Boolean);
  const photos = (C.attachments || []).filter(x => x.attachmentUri && /\.(jpe?g|png)/i.test(x.attachmentUri));
  const lot = C.lotSize != null ? `${fmt(C.lotSize, 2)} ${C.lotSizeMeasurementType === 2 ? 'acres' : C.lotSizeMeasurementType === 1 ? 'sq ft' : ''}` : '–';
  const wrap = h('div', {});
  wrap.append(h('h3', {}, C.buildingName || 'Commercial property'),
    h('div', { class: 'tiles' },
      tile('Type', enumName('PropertyType', C.propertyType) || '–', C.buildingClass ? `Class ${enumName('BuildingClass', C.buildingClass)}` : ''),
      tile('Stories', C.numStoriesAboveGrade ?? '–', (C.floors || []).length ? `${C.floors.length} floor records` : ''),
      tile('Rentable area', C.rentableBuildingAreaSquareFeet ? `${fmt(C.rentableBuildingAreaSquareFeet, 0)} sq ft` : '–', C.grossTypicalFloorSquareFeet ? `typical floor ${fmt(C.grossTypicalFloorSquareFeet, 0)} sq ft` : ''),
      tile('Built', yr ?? '–', reno.join(' · ')),
      tile('Lot', lot, C.parkingRatio ? `parking ${fmt(C.parkingRatio, 1)} / 1,000 sq ft` : '')),
    h('div', { class: 'grid2' },
      kv([['Property id', h('code', {}, C.id)], ['Address', [a.streetNumber, a.streetName, a.streetType].filter(Boolean).join(' ') + (a.city ? `, ${a.city}, ${a.state} ${a.postcode?.slice(0, 5) || ''}` : '')],
        ['Lat / lon', a.latitude ? `${a.latitude}, ${a.longitude}` : '–'], ['Status', enumName('ConstructionStatus', C.constructionStatus)],
        ['Construction', enumName('BuildingConstructionMaterialType', C.buildingConstructionMaterial)], ['Sprinklers', C.hasSprinklers == null ? '–' : C.hasSprinklers ? 'yes' : 'no'],
        ['Zoning', C.zoningDescription], ['Parcels', (C.parcelNumbers || []).join(', ') || '–'],
        ['Gross building area', C.grossBuildingAreaSquareFeet ? `${fmt(C.grossBuildingAreaSquareFeet, 0)} sq ft` : '–']]),
      h('div', {}, h('div', { class: 'muted small' }, 'Notes'), note.length ? note.map(t => h('p', { class: 'small' }, t)) : h('p', { class: 'small' }, '–'))));
  if ((C.floors || []).length) wrap.append(h('h3', {}, 'Floors'), h('div', { class: 'tablebox', style: 'max-height:260px' }, h('table', {},
    h('thead', {}, h('tr', {}, h('th', {}, 'Floor'), h('th', { class: 'num' }, 'Size sq ft'))),
    h('tbody', {}, C.floors.map(f => h('tr', {}, h('td', {}, enumName('FloorName', f.floorName) || f.floorName), h('td', { class: 'num' }, fmt(f.floorSize?.squareFeet, 0))))))));
  if (photos.length) wrap.append(h('h3', {}, `Building photos (${photos.length})`), h('div', { class: 'photos' }, photos.slice(0, 24).map(x => h('img', { src: x.attachmentUri, loading: 'lazy', alt: x.caption || 'Building photo', title: x.caption || '', referrerpolicy: 'no-referrer', onerror: e => e.target.remove() }))));
  return wrap;
}

main().catch(e => { console.error(e); $('#app').replaceChildren(h('p', { class: 'err' }, 'Failed to load: ' + e.message)); });
</script>
