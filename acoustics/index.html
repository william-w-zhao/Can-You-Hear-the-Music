<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Acoustics</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --ink:#121a2b; --muted:#5a6577; --faint:#8a94a6; --line:#d7dde6;
  --accent:#9a5f00; --accent-soft:#fcefcb; --link:#2a63c9; --ref:#eb6834; --critical:#d03b3b;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0e1420; --surface:#151d2c; --surface-2:#1b2435; --ink:#e6ebf3; --muted:#9da8ba; --faint:#6f7a8d; --line:#273246;
    --accent:#f5c55a; --accent-soft:#3a2e12; --link:#7fa6f0; --ref:#d95926; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0e1420; --surface:#151d2c; --surface-2:#1b2435; --ink:#e6ebf3; --muted:#9da8ba; --faint:#6f7a8d; --line:#273246;
  --accent:#f5c55a; --accent-soft:#3a2e12; --link:#7fa6f0; --ref:#d95926; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link)}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header nav{margin-left:auto;display:flex;gap:10px;font-size:.9rem}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.25rem;margin:0 0 4px} h3{font-size:1rem;margin:18px 0 8px} h4{margin:0 0 6px}
p{margin:6px 0;max-width:78ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
select,button,input{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
button{cursor:pointer} button:hover{border-color:var(--ink)}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.tile{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg)}
.tile .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tile .v{font-size:1.35rem;font-weight:700;line-height:1.25}
.tile .s{font-size:.8rem;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
.plan{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#2b2f36}
.plan img,.plan svg{display:block;width:100%;height:auto}
.plan svg{position:absolute;inset:0;height:100%}
.panel{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface);display:inline-flex;gap:5px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:50%}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.legend .ramp{width:160px;height:10px;border-radius:3px;display:inline-block;vertical-align:-1px;margin:0 4px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted);align-self:center} .kv dd{margin:0}
.kv select{width:100%}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--surface-2)} tr.sel td{background:var(--accent-soft)}
.tablebox{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.chart{width:100%;height:auto;display:block} .chart text{fill:var(--muted);font-size:10.5px}
details{border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-top:12px;background:var(--bg)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--surface);padding:7px 9px;border-radius:7px;font-size:.8rem;line-height:1.4;max-width:280px;display:none}
.err{color:var(--critical)}
@media (max-width:960px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="in">
  <strong>Room acoustics</strong>
  <select id="sel" aria-label="Building"></select>
  <nav><a id="explorerLink" href="http://localhost:8765/">Building explorer ↗</a><a href="http://localhost:8765/keys">Key check ↗</a></nav>
</div></header>
<main id="app"><p class="muted">Loading…</p></main>
<div class="tip" id="tip"></div>
<script>
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg', SVGT = new Set(['svg', 'g', 'line', 'polygon', 'path', 'text', 'rect', 'circle']);
function h(tag, attrs = {}, ...kids) {
  const e = SVGT.has(tag) ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const fmt = (v, d = 1) => v == null ? '–' : Number(v).toLocaleString(undefined, { maximumFractionDigits: d });
const tipEl = $('#tip');
function showTip(ev, html) { tipEl.innerHTML = html; tipEl.style.display = 'block';
  tipEl.style.left = Math.min(ev.clientX + 14, innerWidth - tipEl.offsetWidth - 8) + 'px'; tipEl.style.top = Math.min(ev.clientY + 14, innerHeight - tipEl.offsetHeight - 8) + 'px'; }
const hideTip = () => tipEl.style.display = 'none';
const tile = (k, v, s) => h('div', { class: 'tile' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v), s ? h('div', { class: 's' }, s) : null);
const SEQ = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'];
function lerpHex(a, b, t) { const p = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16)), A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function ramp(t) { t = Math.max(0, Math.min(1, t)); const x = t * (SEQ.length - 1), i = Math.min(Math.floor(x), SEQ.length - 2); return lerpHex(SEQ[i], SEQ[i + 1], x - i); }
const rtColor = t => ramp((t - 0.2) / 1.6);
const VERDICTS = [[0.5, 'Excellent for calls'], [0.7, 'Good for calls'], [1.0, 'Noticeable echo'], [99, 'Echoey']];
const verdict = t => VERDICTS.find(v => t <= v[0])[1];

// Mirrors acoustics.py: Eyring per band (125 Hz, 500 Hz, 2 kHz), air absorption at 2 kHz.
function eyring(room, m, A) {
  const V = room.volume_m3, walls = room.perimeter_m * room.height_m, glass = Math.min(m.glass_m2, walls * 0.9);
  const surf = [[m.floor, room.area_m2], [m.ceiling, room.area_m2], [m.walls, walls - glass], ['glass', glass]];
  const S = surf.reduce((s, x) => s + x[1], 0), cont = A.contents[m.furnishing] || [0, 0, 0], parts = [];
  const res = [0, 1, 2].map(b => {
    let tot = 0;
    for (const [mat, area] of surf) { const a = area * Math.min(A.materials[mat].a[b], 0.99); tot += a; if (b === 1) parts.push([A.materials[mat].name, a]); }
    const c = cont[b] * room.area_m2; tot += c; if (b === 1 && c) parts.push(['Furniture and contents', c]);
    const air = b === 2 ? 4 * A.air_m_2k * V : 0;
    return { t: 0.161 * V / (-S * Math.log(1 - Math.min(tot / S, 0.95)) + air), tot };
  });
  return { rt: res.map(r => r.t), absorb: res[1].tot, parts: parts.sort((a, b) => b[1] - a[1]) };
}

// Listening: a dry clip convolved with a synthetic impulse response from the three echo times.
let AC = null, VOICE = null, PLAYING = null;
async function ctx() { AC ??= new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') await AC.resume(); return AC; }
async function voice(url) { if (!VOICE) { const c = await ctx(); VOICE = await c.decodeAudioData(await (await fetch(url)).arrayBuffer()); } return VOICE; }
function clap(c) { const sr = c.sampleRate, n = Math.round(sr * 0.012), b = c.createBuffer(1, Math.round(sr * 0.5), sr), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (n / 4)); return b; }
function impulse(c, rt, absorb) {
  const sr = c.sampleRate, len = Math.round(sr * Math.min(3.5, Math.max(...rt) * 1.3 + 0.05)), ir = c.createBuffer(2, len, sr);
  const ratio = 16 * Math.PI * 1.5 * 1.5 / absorb;            // reverberant / direct energy, 1.5 m from the talker
  const lpA = Math.exp(-2 * Math.PI * 300 / sr), hpA = Math.exp(-2 * Math.PI * 1500 / sr), pre = Math.round(sr * 0.004);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch); let lo = 0, lp2 = 0, e = 0;
    for (let i = pre; i < len; i++) {
      const t = (i - pre) / sr, w = Math.random() * 2 - 1;
      lo = lpA * lo + (1 - lpA) * w; lp2 = hpA * lp2 + (1 - hpA) * w;
      const hi = w - lp2, mid = w - lo - hi;
      d[i] = lo * Math.exp(-6.91 * t / rt[0]) + mid * Math.exp(-6.91 * t / rt[1]) + hi * Math.exp(-6.91 * t / rt[2]); e += d[i] * d[i];
    }
    const g = Math.sqrt(ratio / e); for (let i = pre; i < len; i++) d[i] *= g; d[0] = 1;
  }
  return ir;
}
function stop() { try { PLAYING?.stop(); } catch (e) {} PLAYING = null; }
async function play(rt, absorb, kind, url, done) {
  const c = await ctx(); stop();
  const src = c.createBufferSource(); src.buffer = kind === 'clap' ? clap(c) : await voice(url);
  const conv = c.createConvolver(); conv.normalize = false; conv.buffer = impulse(c, rt, absorb);
  const g = c.createGain(); g.gain.value = 0.35;
  src.connect(conv).connect(g).connect(c.createDynamicsCompressor()).connect(c.destination);
  src.onended = () => { if (PLAYING === src) PLAYING = null; done?.(); }; src.start(); PLAYING = src;
}

async function main() {
  const idx = await fetch('data/index.json').then(r => r.json()).catch(() => ({}));
  const have = [];
  for (const sid of Object.keys(idx)) if ((await fetch(`data/${sid}/acoustics.json`, { method: 'HEAD' })).ok) have.push(sid);
  const sel = $('#sel');
  have.forEach(s => sel.append(h('option', { value: s }, `${idx[s]} (${s})`)));
  const sid = new URLSearchParams(location.search).get('m') || have[0];
  if (!sid) { $('#app').replaceChildren(h('p', {}, 'No acoustics yet. Run rooms_from_cloud.py and acoustics.py for a model.')); return; }
  sel.value = sid; sel.onchange = () => location.search = '?m=' + sel.value;
  $('#explorerLink').href = 'http://localhost:8765/?m=' + encodeURIComponent(sid);
  const A = await fetch(`data/${sid}/acoustics.json`).then(r => r.json());
  const B = await fetch(`data/${sid}/bundle.json`).then(r => r.json()).catch(() => null);
  render(sid, A, B);
}

function render(sid, A, B) {
  const fp = A.floorplan, rooms = A.rooms, base = `data/${sid}/`;
  const scan = r => ({ floor: r.floor, ceiling: r.ceiling, walls: r.walls, glass_m2: r.glass_m2, furnishing: r.furnishing });
  const custom = Object.fromEntries(rooms.map(r => [r.id, scan(r)]));
  const calc = r => eyring(r, custom[r.id], A);
  const name = B?.matterport?.basics?.address?.address || B?.matterport?.basics?.name || sid;
  const sorted = rooms.slice().sort((a, b) => a.rt60[1] - b.rt60[1]);
  let sel = sorted[0].id;

  const app = $('#app');
  app.replaceChildren();
  const head = h('section', {},
    h('h1', {}, name),
    h('p', { class: 'muted' }, 'Room shapes from the 3D scan, materials read from its panoramas, echo time from Eyring’s formula. Click a room, listen, then try other materials.'),
    h('div', { class: 'tiles' },
      tile('Rooms analysed', rooms.length, A.segmentation.startsWith('point') ? 'split from the point cloud' : 'Matterport room outlines'),
      tile('Clearest room', sorted[0].type, `${sorted[0].rt60[1]} s echo`),
      tile('Most echoey', sorted.at(-1).type, `${sorted.at(-1).rt60[1]} s echo`),
      tile('Floor area', fmt(rooms.reduce((s, r) => s + r.area_m2, 0), 0) + ' m²', `ceilings ${fmt(Math.min(...rooms.map(r => r.height_m)), 2)}–${fmt(Math.max(...rooms.map(r => r.height_m)), 2)} m`)));
  app.append(head);

  const svg = h('svg', { viewBox: `0 0 ${fp.width} ${fp.height}` });
  const card = h('div', { class: 'panel' });
  const tbody = h('tbody');
  const fs = Math.max(28, fp.width / 65);
  const redraw = () => { drawPlan(); drawCard(); drawTable(); };

  function drawPlan() {
    svg.replaceChildren();
    for (const r of rooms) {
      const t = calc(r).rt[1], on = r.id === sel;
      svg.append(h('polygon', { points: r.polygon_px.map(q => q.join(',')).join(' '),
        style: `fill:${rtColor(t)};fill-opacity:.6;stroke:${on ? '#eb6834' : '#fff'};stroke-width:${on ? 12 : 4};cursor:pointer`,
        onmousemove: e => showTip(e, `<b>${r.type}</b><br>echo ${t.toFixed(2)} s · ${verdict(t)}<br>${r.area_m2} m² · ceiling ${r.height_m} m`),
        onmouseleave: hideTip, onclick: () => { sel = r.id; redraw(); } }));
      svg.append(h('text', { x: r.center_px[0], y: r.center_px[1], 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 700, fill: '#10181f',
        stroke: '#fff', 'stroke-width': fs / 5, 'paint-order': 'stroke', 'pointer-events': 'none' }, `${t.toFixed(2)} s`));
    }
  }

  function select(opts, val, on) { return h('select', { onchange: e => on(e.target.value) }, opts.map(([k, n]) => h('option', { value: k, selected: k === val }, n))); }
  function drawCard() {
    const r = rooms.find(x => x.id === sel), m = custom[r.id], now = calc(r), was = eyring(r, scan(r), A);
    const changed = JSON.stringify(m) !== JSON.stringify(scan(r));
    const mats = k => k.map(x => [x, A.materials[x].name]);
    const set = (k, v) => { m[k] = k === 'glass_m2' ? +v : v; redraw(); };
    const status = h('span', { class: 'muted small' });
    const btn = (label, res, kind) => h('button', { onclick: async () => { status.textContent = 'Playing…'; await play(res.rt, res.absorb, kind, A.voice, () => status.textContent = ''); } }, label);
    const W = 320, Hc = 120, max = Math.max(1.6, ...now.rt, ...was.rt);
    const chart = h('svg', { class: 'chart', viewBox: `0 0 ${W} ${Hc + 24}`, role: 'img', 'aria-label': 'Echo time by pitch' });
    [0.5, 1, 1.5, 2, 2.5].filter(v => v <= max).forEach(v => chart.append(
      h('line', { x1: 34, x2: W, y1: Hc - v / max * Hc, y2: Hc - v / max * Hc, stroke: 'var(--line)' }),
      h('text', { x: 30, y: Hc - v / max * Hc + 4, 'text-anchor': 'end' }, v + ' s')));
    ['Low · 125 Hz', 'Mid · 500 Hz', 'High · 2 kHz'].forEach((lab, i) => {
      const x = 46 + i * 92, bw = changed ? 34 : 64;
      const bar = (val, dx, col, who) => { const hh = Math.max(4, val / max * Hc);
        chart.append(h('path', { d: `M${x + dx},${Hc} V${Hc - hh + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${Hc} Z`, fill: col,
          onmousemove: e => showTip(e, `${who}: ${val.toFixed(2)} s (${lab})`), onmouseleave: hideTip })); };
      bar(was.rt[i], 0, '#2a78d6', 'As scanned'); if (changed) bar(now.rt[i], 38, '#eb6834', 'What-if');
      chart.append(h('text', { x: x + (changed ? 36 : 32), y: Hc + 16, 'text-anchor': 'middle' }, lab));
    });
    const t = now.rt[1];
    card.replaceChildren(
      h('h4', {}, r.type, r.matterport_label && r.matterport_label !== r.type ? h('span', { class: 'muted small' }, ` · Matterport: ${r.matterport_label}`) : null),
      h('div', { class: 'toolbar', style: 'align-items:baseline' },
        h('span', { style: 'font-size:1.9rem;font-weight:700' }, `${t.toFixed(2)} s`),
        h('span', { class: 'chip' }, h('span', { class: 'dot', style: `background:${rtColor(t)}` }), verdict(t)),
        h('span', { class: 'muted small' }, changed ? `as scanned ${was.rt[1].toFixed(2)} s` : `likely ${r.rt60_range_500[0]}–${r.rt60_range_500[1]} s`)),
      chart,
      h('div', { class: 'legend' }, h('span', {}, h('span', { class: 'sw', style: 'background:#2a78d6' }), 'as scanned'),
        changed ? h('span', {}, h('span', { class: 'sw', style: 'background:#eb6834' }), 'what-if') : null),
      h('div', { class: 'toolbar', style: 'margin-top:10px' },
        btn('▶ Voice · as scanned', was, 'voice'), changed ? btn('▶ Voice · what-if', now, 'voice') : null,
        btn('▶ Clap', now, 'clap'), h('button', { onclick: () => { stop(); status.textContent = ''; }, 'aria-label': 'Stop' }, '■'), status),
      h('h4', { style: 'margin-top:14px' }, 'What if…'),
      h('dl', { class: 'kv' },
        h('dt', {}, 'Floor'), h('dd', {}, select(mats(['commercial_carpet', 'carpet_on_pad', 'wood_floor', 'vinyl_tile', 'concrete']), m.floor, v => set('floor', v))),
        h('dt', {}, 'Ceiling'), h('dd', {}, select(mats(['acoustic_tile', 'drywall_ceiling', 'plaster', 'exposed_concrete']), m.ceiling, v => set('ceiling', v))),
        h('dt', {}, 'Walls'), h('dd', {}, select(mats(['drywall', 'plaster', 'brick', 'concrete', 'acoustic_panel']), m.walls, v => set('walls', v))),
        h('dt', {}, 'Contents'), h('dd', {}, select([['empty', 'Empty'], ['built_in', 'Built-ins only'], ['cabinets', 'Cabinets'], ['furnished', 'Furnished (sofa, rug, desk…)']], m.furnishing, v => set('furnishing', v))),
        h('dt', {}, 'Glass'), h('dd', {}, h('input', { type: 'number', min: 0, step: 0.5, value: m.glass_m2, style: 'width:80px', onchange: e => set('glass_m2', e.target.value) }), ' m²')),
      h('div', { class: 'toolbar', style: 'margin-top:8px' },
        h('button', { onclick: () => { Object.assign(m, { ceiling: 'exposed_concrete', floor: 'concrete' }); redraw(); } }, 'Try the exposed-ceiling look'),
        h('button', { onclick: () => { Object.assign(m, { furnishing: m.furnishing === 'furnished' ? 'empty' : 'furnished' }); redraw(); } }, m.furnishing === 'furnished' ? 'Empty it' : 'Furnish it'),
        changed ? h('button', { onclick: () => { Object.assign(m, scan(r)); redraw(); } }, 'Reset') : null),
      h('p', { class: 'small muted' }, `${r.area_m2} m² × ${r.height_m} m ceiling${r.height_measured === false ? ' (assumed)' : ''} = ${r.volume_m3} m³. Biggest sound absorber: ${now.parts[0][0].toLowerCase()} (${Math.round(now.parts[0][1] / now.absorb * 100)}%).`),
      r.notes ? h('p', { class: 'small muted' }, 'Seen in the panoramas: ' + r.notes) : null);
  }

  function drawTable() {
    tbody.replaceChildren(...rooms.map(r => { const c = calc(r);
      return h('tr', { class: r.id === sel ? 'sel' : '', onclick: () => { sel = r.id; redraw(); } },
        h('td', {}, r.type), h('td', { class: 'num' }, r.area_m2), h('td', { class: 'num' }, r.height_m),
        h('td', {}, A.materials[custom[r.id].floor].name), h('td', {}, A.materials[custom[r.id].ceiling].name), h('td', {}, A.materials[custom[r.id].walls].name),
        h('td', { class: 'num' }, c.rt.map(v => v.toFixed(2)).join(' / ')), h('td', {}, verdict(c.rt[1]))); }));
  }
  redraw();

  app.append(h('section', {},
    h('div', { class: 'wrap' },
      h('div', {}, h('div', { class: 'plan' }, h('img', { src: base + fp.file, alt: 'Floor plan' }), svg),
        h('div', { class: 'legend' }, 'Echo time, mid pitch: 0.2 s', h('span', { class: 'ramp', style: `background:linear-gradient(90deg,${SEQ.join(',')})` }), '1.8 s+', h('span', {}, '· click a room'))),
      card),
    h('h3', {}, 'All rooms'),
    h('div', { class: 'tablebox' }, h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, 'Room'), h('th', { class: 'num' }, 'm²'), h('th', { class: 'num' }, 'Ceiling m'), h('th', {}, 'Floor'), h('th', {}, 'Ceiling'), h('th', {}, 'Walls'), h('th', { class: 'num' }, 'Echo s · low / mid / high'), h('th', {}, 'For calls'))),
      tbody)),
    h('details', {}, h('summary', {}, 'How it works, and what it can’t tell you yet'),
      h('ol', { class: 'small' },
        h('li', {}, 'Rooms: ' + A.segmentation + '.'),
        h('li', {}, 'Materials: ' + A.materials_source),
        h('li', {}, 'Echo time (RT60, seconds for a sound to fade away): Eyring’s formula for low, middle and high pitch, using typical published absorption values. “Likely” ranges cover the spread of those values.'),
        h('li', {}, 'Listening: a dry voice clip is convolved in your browser with an impulse response built from the three echo times, heard 1.5 m from the talker.')),
      h('p', { class: 'small' }, h('b', {}, 'Not validated yet. '), 'Wall construction behind the paint, ceiling-tile grade and the furniture a tenant brings are estimates. Next step: clap-test 3–4 rooms at the venue with a phone and compare. Sound passing between rooms, or in from the street, is not modelled here.'))));
}
main().catch(e => { console.error(e); $('#app').replaceChildren(h('p', { class: 'err' }, 'Failed to load: ' + e.message)); });
</script>
