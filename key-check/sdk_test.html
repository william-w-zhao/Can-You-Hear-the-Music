<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase SDK Check</title>
<style>
  :root { --bg:#f4f6f9; --ink:#121a2b; --muted:#5a6577; --line:#d7dde6; --ok:#16794c; --bad:#b3261e; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1420; --ink:#e6ebf3; --muted:#9da8ba; --line:#273246; --ok:#5dd39e; --bad:#f08079; --card:#151d2c; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 14px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  input, button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  button { cursor:pointer; font-weight:600; }
  .grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:14px; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
  iframe { width:100%; aspect-ratio:16/10; border:1px solid var(--line); border-radius:10px; background:#000; }
  #log { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:12.5px/1.55 ui-monospace, Menlo, monospace; white-space:pre-wrap; overflow:auto; max-height:520px; margin:0; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
<script src="/config.js"></script>
</head>
<body>
<main>
  <h1>Matterport Showcase SDK key check</h1>
  <p>Loads a model in the embedded 3D viewer with your SDK key, connects the SDK, and reads model data, camera pose, sweeps and rooms.</p>
  <div class="bar">
    <input id="model" value="zvKHR9DHNjJ" aria-label="Model id" size="14">
    <button id="go">Connect</button>
  </div>
  <div class="grid">
    <iframe id="showcase" allow="xr-spatial-tracking; fullscreen" title="Matterport Showcase"></iframe>
    <pre id="log"></pre>
  </div>
</main>
<script>
const log = (msg, cls) => {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
};
const iframe = document.getElementById('showcase');
const key = window.MP_SDK_KEY || '';

function withTimeout(p, ms, what) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what + ' timed out after ' + ms / 1000 + 's')), ms))]);
}

async function run() {
  document.getElementById('log').textContent = '';
  const model = document.getElementById('model').value.trim();
  if (!key) { log('FAIL  MATTERPORT_SDK_KEY is not set in key-check/.env (add it, then reload this page)', 'bad'); return; }
  log('SDK key: set (' + key.length + ' chars)');
  log('Loading model ' + model + ' …');

  iframe.src = 'https://my.matterport.com/show/?m=' + encodeURIComponent(model) +
               '&play=1&qs=1&applicationKey=' + encodeURIComponent(key);
  await new Promise(r => iframe.addEventListener('load', r, { once: true }));

  if (!window.MP_SDK) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://static.matterport.com/showcase-sdk/latest.js';
      s.onload = res; s.onerror = () => rej(new Error('could not load showcase-sdk/latest.js'));
      document.head.appendChild(s);
    }).catch(e => { log('FAIL  ' + e.message, 'bad'); throw e; });
  }

  let sdk;
  try {
    sdk = await withTimeout(window.MP_SDK.connect(iframe, key, ''), 30000, 'SDK connect');
    log('PASS  SDK connected (key accepted for this origin)', 'ok');
  } catch (e) {
    log('FAIL  SDK connect: ' + String(e && e.message || e).split(key).join('<key>'), 'bad');
    log('      Common causes: key not valid, or this origin (' + location.origin + ') is not on the key\'s allowed domains.');
    return;
  }

  try {
    const m = await sdk.Model.getData();
    log('PASS  Model.getData: sid ' + m.sid + ', ' + (m.sweeps ? m.sweeps.length + ' sweeps' : 'ok'), 'ok');
  } catch (e) { log('FAIL  Model.getData: ' + e.message, 'bad'); }

  // Camera and sweeps only report once the 3D viewer has finished loading.
  try {
    log('Waiting for the 3D viewer to finish loading …');
    await withTimeout(new Promise(res => {
      const sub = sdk.App.state.subscribe(st => {
        if (st.phase === sdk.App.Phase.PLAYING) { sub.cancel(); res(); }
      });
    }), 120000, 'Viewer load');
    log('PASS  Viewer playing', 'ok');
  } catch (e) { log('FAIL  ' + e.message + ' (keep this tab in front while it loads)', 'bad'); }

  try {
    await withTimeout(new Promise(res => {
      const sub = sdk.Camera.pose.subscribe(pose => {
        const p = pose.position, r = pose.rotation;
        log('PASS  Camera.pose: position (' + [p.x, p.y, p.z].map(v => v.toFixed(2)).join(', ') +
            ') rotation (' + r.x.toFixed(1) + '°, ' + r.y.toFixed(1) + '°) mode ' + pose.mode, 'ok');
        sub.cancel(); res();
      });
    }), 20000, 'Camera.pose');
  } catch (e) { log('FAIL  ' + e.message, 'bad'); }

  try {
    await withTimeout(new Promise(res => {
      let n = 0, t;
      const sub = sdk.Sweep.data.subscribe({
        onAdded() { n++; clearTimeout(t); t = setTimeout(() => { log('PASS  Sweep.data: ' + n + ' sweeps', 'ok'); sub.cancel(); res(); }, 800); },
        onCollectionUpdated(c) { n = Object.keys(c).length; }
      });
    }), 20000, 'Sweep.data');
  } catch (e) { log('FAIL  ' + e.message, 'bad'); }

  if (sdk.Room && sdk.Room.data) {
    try {
      await withTimeout(new Promise(res => {
        const sub = sdk.Room.data.subscribe({
          onCollectionUpdated(c) {
            const rooms = Object.values(c);
            log('PASS  Room.data: ' + rooms.length + ' rooms', 'ok');
            sub.cancel(); res();
          }
        });
      }), 15000, 'Room.data');
    } catch (e) { log('WARN  ' + e.message + ' (Room API may need a newer SDK version)'); }
  }

  log('Done. Drag in the viewer to look around.');
  window.sdk = sdk; // for poking at it in DevTools
}

document.getElementById('go').addEventListener('click', () => run().catch(() => {}));
run().catch(() => {});
</script>
</body>
</html>
